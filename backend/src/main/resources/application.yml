server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: omniagent-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omniagent_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6389}
      password: ${SPRING_DATA_REDIS_PASSWORD:RedisSecurePass123!}
      timeout: 2000ms
      repositories:
        enabled: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

# Security Configuration
omniagent:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: 900000 # 15 minutes
      refresh-token-expiration-ms: 2592000000 # 30 days
  vault:
    # 256-bit AES-GCM base64 master key
    master-key: ${OMNIAGENT_KMS_MASTER_KEY:7vF8kL3zQp1mN4bW9xR2tY5uI8oP0sA3dF6gH9jK1lE=}
  ai:
    primary-provider: ${OMNIAGENT_PRIMARY_AI:GEMINI} # GEMINI, CLAUDE, or OPENAI
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}
      timeout-seconds: 45
    claude:
      api-key: ${CLAUDE_API_KEY:${ANTHROPIC_API_KEY:}}
      model: ${CLAUDE_MODEL:claude-3-5-sonnet-20241022}
      timeout-seconds: 45
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o}
      timeout-seconds: 45
  telegram:
    webhook-base-url: ${TELEGRAM_WEBHOOK_BASE_URL:http://localhost:8080/api/v1/webhooks/telegram}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
