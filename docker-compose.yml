services:
  # ============================================================================
  # 1. PostgreSQL 16 Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: novasphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniagent_dev}
      POSTGRES_USER: ${POSTGRES_USER:-platform_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PlatformSecurePass123!}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_admin} -d ${POSTGRES_DB:-omniagent_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novasphere-net

  # ============================================================================
  # 2. Redis 7 Cache & Rate Limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: novasphere-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-RedisSecurePass123!}" --appendonly yes
    ports:
      - "${REDIS_PORT:-6388}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecurePass123!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novasphere-net

  # ============================================================================
  # 3. RabbitMQ 3.13 Message Broker & Worker Queue
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: novasphere-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-platform_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-RabbitSecurePass123!}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "${RABBITMQ_PORT:-5674}:5672"
      - "${RABBITMQ_MGMT_PORT:-15674}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novasphere-net

  # ============================================================================
  # 4. NovaSphere Backend (Spring Boot 3.3.4 / Java 21)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: novasphere-backend:latest
    container_name: novasphere-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-omniagent_dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-platform_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-PlatformSecurePass123!}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSecurePass123!}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-platform_mq}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-RabbitSecurePass123!}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6IDUMVSOyuhcn51vx2lOPoYYTseTwViulEzO_dD0Lt9rQ}
      OMNIAGENT_KMS_MASTER_KEY: ${OMNIAGENT_KMS_MASTER_KEY:-OmniAgentKmsKey2026SecureVault!}
      OMNIAGENT_KMS_ACTIVE_KEY_ID: kms-v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - novasphere-net

  # ============================================================================
  # 5. NovaSphere Frontend (Next.js 14 App Router)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8090}/api/v1
        NEXT_PUBLIC_APP_NAME: "NovaSphere AI"
        NEXT_PUBLIC_DEFAULT_LANGUAGE: uz-Latn
    image: novasphere-frontend:latest
    container_name: novasphere-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8090}/api/v1
    depends_on:
      - backend
    networks:
      - novasphere-net

networks:
  novasphere-net:
    driver: bridge

volumes:
  postgres_data:
    name: novasphere_postgres_data
  redis_data:
    name: novasphere_redis_data
  rabbitmq_data:
    name: novasphere_rabbitmq_data
